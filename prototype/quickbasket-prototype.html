<title>QuickBasket Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: role switcher bar on top; customer app = header + catalogue + cart drawer + assistant; admin = tabs + tables; partner = phone-width cards. */
:root{
  --bg:#F3F7F4; --surface:#FFFFFF; --surface-2:#EAF1EC; --ink:#10261C; --muted:#586C61; --line:#D9E4DC;
  --brand:#15803F; --brand-ink:#FFFFFF; --brand-soft:#DCF2E4;
  --accent:#F4622F; --accent-soft:#FFE6DC;
  --good:#15803F; --good-bg:#DCF2E4; --warn:#8A5A00; --warn-bg:#FFF0C7; --bad:#B42318; --bad-bg:#FDE4E0; --info:#1F5FA8; --info-bg:#DEEBFA;
  --shadow:0 1px 2px rgba(16,38,28,.06),0 8px 24px rgba(16,38,28,.07);
  --display:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1510; --surface:#13201A; --surface-2:#1A2A22; --ink:#E7F1EA; --muted:#98ADA1; --line:#26382E;
  --brand:#3FBF7A; --brand-ink:#06210F; --brand-soft:#173826;
  --accent:#FF8358; --accent-soft:#3B2217;
  --good:#52D18C; --good-bg:#173826; --warn:#F1BF5A; --warn-bg:#3A2D0F; --bad:#FF8B7C; --bad-bg:#3E1B17; --info:#7DB4F2; --info-bg:#15283F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0B1510; --surface:#13201A; --surface-2:#1A2A22; --ink:#E7F1EA; --muted:#98ADA1; --line:#26382E;
  --brand:#3FBF7A; --brand-ink:#06210F; --brand-soft:#173826;
  --accent:#FF8358; --accent-soft:#3B2217;
  --good:#52D18C; --good-bg:#173826; --warn:#F1BF5A; --warn-bg:#3A2D0F; --bad:#FF8B7C; --bad-bg:#3E1B17; --info:#7DB4F2; --info-bg:#15283F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ink);z-index:60}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto}

/* role bar */
.rolebar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--ink);color:var(--bg);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.rolebar .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pill-note{font-size:12px;opacity:.8;margin-left:auto}
.rolebar .who{font-size:13px;opacity:.9}
.rolebar .btn{background:transparent;color:inherit;border-color:rgba(255,255,255,.35);min-height:32px}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.12);padding:3px;border-radius:999px}
.tabs button{border:0;background:transparent;color:inherit;padding:6px 14px;border-radius:999px;font-weight:600;font-size:13px}
.tabs button[aria-pressed="true"]{background:var(--bg);color:var(--ink)}
.rolebar b{font-family:var(--display);font-size:15px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:12px;font-weight:600;display:inline-flex;gap:8px;align-items:center;justify-content:center;min-height:44px}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-good{background:var(--good-bg);color:var(--good)} .p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)} .p-info{background:var(--info-bg);color:var(--info)} .p-mute{background:var(--surface-2);color:var(--muted)}

/* customer header */
.chead{display:grid;grid-template-columns:auto 1fr auto;gap:12px 20px;align-items:center;padding:16px 0}
.logo{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0}
.logo svg{width:38px;height:38px}
.logo span{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.logo span i{font-style:normal;color:var(--brand)}
.search{position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px 12px 42px;min-height:46px}
.search svg{position:absolute;left:14px;top:50%;translate:0 -50%;width:18px;height:18px;color:var(--muted)}
.hactions{display:flex;gap:8px;justify-self:end}
.badge{background:var(--accent);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700}
.eta{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px;margin-bottom:12px;flex-wrap:wrap}
.eta b{color:var(--ink)}

/* hero */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:20px}
.hero .main{background:var(--brand);color:var(--brand-ink);border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:10px;justify-content:center;min-width:0}
.hero h1{font-size:clamp(28px,4.6vw,46px);line-height:1.02;font-weight:800}
.hero p{margin:0;opacity:.9;max-width:44ch}
.hero .side{background:var(--accent-soft);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:6px;justify-content:center;min-width:0}
.hero .side h3{font-size:20px}
.hero .side p{margin:0;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;scrollbar-width:thin}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sectiontitle{display:flex;align-items:baseline;justify-content:space-between;margin:6px 0 12px}
.sectiontitle h2{font-size:22px}
.muted{color:var(--muted)}

/* products */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pimg{aspect-ratio:1.25;border-radius:12px;display:grid;place-items:center;font-size:44px;background:color-mix(in srgb,var(--tint) 24%,var(--surface));position:relative}
.off{position:absolute;top:8px;left:8px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:8px}
.pname{font-weight:600;line-height:1.25}
.punit{font-size:12px;color:var(--muted)}
.prow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:6px}
.price b{font-size:16px} .price s{font-size:12px;color:var(--muted);margin-left:4px}
.stepper{display:inline-flex;align-items:center;background:var(--brand);color:var(--brand-ink);border-radius:10px;overflow:hidden}
.stepper button{border:0;background:transparent;color:inherit;width:34px;height:34px;font-size:18px;font-weight:700}
.stepper span{min-width:22px;text-align:center;font-weight:700}
.addbtn{border:1.5px solid var(--brand);color:var(--brand);background:transparent;border-radius:10px;padding:6px 16px;font-weight:700;min-height:34px}
.addbtn:hover{background:var(--brand-soft)}
.empty{padding:40px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:18px}

/* floating cart */
.cartbar{position:fixed;left:50%;translate:-50% 0;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;width:min(460px,calc(100% - 32px));
  background:var(--ink);color:var(--bg);border:0;border-radius:16px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;font-weight:700;box-shadow:var(--shadow)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:39}

/* drawer / modal */
.scrim{position:fixed;inset:0;background:rgba(5,15,10,.55);z-index:70;display:flex;justify-content:flex-end}
.scrim.center{justify-content:center;align-items:center;padding:16px}
.drawer{background:var(--surface);width:min(440px,100%);height:100%;padding:20px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) 20px;overflow:auto;display:flex;flex-direction:column;gap:14px;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.modal{background:var(--surface);border-radius:20px;padding:24px;width:min(460px,100%);display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.dhead{display:flex;justify-content:space-between;align-items:center}
.line{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.line .pimg{aspect-ratio:1;font-size:26px;border-radius:10px}
.bill{display:flex;flex-direction:column;gap:6px}
.bill div{display:flex;justify-content:space-between}
.bill .total{font-weight:700;font-size:17px;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.note{font-size:12.5px;color:var(--muted)}
.callout{background:var(--info-bg);color:var(--info);border-radius:12px;padding:10px 12px;font-size:13px}
.callout.warn{background:var(--warn-bg);color:var(--warn)}

/* checkout */
.cols{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{font-size:18px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface);text-align:left;width:100%}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:2px}
.opt[aria-pressed="true"] .radio{border-color:var(--brand);background:radial-gradient(var(--brand) 45%,transparent 50%)}
.opt small{display:block;color:var(--muted)}
.apps{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.app{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.app[aria-pressed="true"]{border-color:var(--brand);color:var(--brand)}
.sticky{position:sticky;top:calc(64px + env(safe-area-inset-top,0px))}

/* pay */
.paywrap{max-width:560px;margin:8px auto;display:flex;flex-direction:column;gap:14px}
.payhead{text-align:center;display:flex;flex-direction:column;gap:2px}
.payhead .amt{font-family:var(--display);font-size:42px;font-weight:800}
.qrbox{display:grid;place-items:center;padding:18px;background:#fff;border-radius:18px;border:1px solid var(--line);position:relative;margin:0 auto}
.qrbox svg{width:min(260px,70vw);height:auto;display:block}
.qrbox.dead svg{filter:blur(6px) grayscale(1);opacity:.5}
.qrbox .over{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;color:#10261C;text-align:center;padding:12px}
.timer{font-family:var(--display);font-size:28px;font-weight:800;text-align:center}
.status{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px;border-radius:12px;background:var(--surface-2);font-weight:600}
.spin{width:16px;height:16px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.demo{border:1.5px dashed var(--accent);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.demo h4{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.demo .row{display:flex;gap:8px;flex-wrap:wrap}
.rzp{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.rzp header{background:#0C2A4B;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.rzp .body{padding:16px;display:flex;flex-direction:column;gap:10px}
.banks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.banks button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 6px;font-weight:600}
.big{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin:0 auto;font-size:34px}
.big.good{background:var(--good-bg);color:var(--good)} .big.bad{background:var(--bad-bg);color:var(--bad)}

/* tracking */
.tl{display:flex;flex-direction:column;gap:0}
.step{display:grid;grid-template-columns:28px 1fr;gap:12px;padding-bottom:20px;position:relative}
.step::before{content:"";position:absolute;left:13px;top:26px;bottom:0;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.step.done::before{background:var(--brand)}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:13px;font-weight:700}
.step.done .dot{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.step.now .dot{border-color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.map{background:var(--surface-2);border-radius:16px;overflow:hidden}
.map svg{display:block;width:100%;height:auto}
.rider{transition:transform 1.4s ease}
.person{display:flex;gap:12px;align-items:center}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:800;font-family:var(--display)}

/* tables & dashboards */
.atabs{display:flex;gap:6px;margin:16px 0;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--display);font-size:30px;font-weight:800}
.stat .d{font-size:12.5px;color:var(--muted)}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;min-width:640px}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 14px;background:var(--surface-2)}
td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
.lowrow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;font-weight:600}
.field input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:42px}

/* partner */
.phone{max-width:480px;margin:16px auto;display:flex;flex-direction:column;gap:14px}
.toggle{display:inline-flex;align-items:center;gap:10px;border:0;background:none;font-weight:700}
.sw{width:46px;height:26px;border-radius:999px;background:var(--line);position:relative;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.toggle[aria-pressed="true"] .sw{background:var(--brand)}
.toggle[aria-pressed="true"] .sw::after{left:23px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.task.new{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.check{display:flex;gap:10px;align-items:center;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--brand)}

/* assistant */
.chat{position:fixed;z-index:80;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100% - 32px));height:min(640px,calc(100% - 96px));
  background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.chat header{padding:14px 16px;background:var(--brand);color:var(--brand-ink);display:flex;justify-content:space-between;align-items:center}
.chat header b{font-family:var(--display);font-size:17px}
.chat header button{border:0;background:rgba(255,255,255,.2);color:inherit;border-radius:10px;width:34px;height:34px;font-size:18px}
.log{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:10px 12px;border-radius:14px;background:var(--surface-2);align-self:flex-start;min-width:0}
.msg.me{background:var(--ink);color:var(--bg);align-self:flex-end}
.list{margin-top:8px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.list h4{margin:0 0 4px;font-size:14px}
.li{display:grid;grid-template-columns:22px 1fr auto auto;gap:8px;align-items:center;padding:5px 0;font-size:13.5px}
.li input{width:18px;height:18px;accent-color:var(--brand)}
.mini{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px}
.mini button{border:0;background:none;width:24px;height:24px}
.mini span{min-width:18px;text-align:center;font-size:13px}
.suggest{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 8px}
.suggest button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12.5px}
.composer{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.composer input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}

#toast{position:fixed;left:50%;translate:-50% 0;top:calc(64px + env(safe-area-inset-top,0px));z-index:100;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

@media (max-width:820px){
  .chead{grid-template-columns:1fr auto}
  .chead{grid-template-columns:minmax(0,1fr)}
  .chead .logo{order:1} .chead .hactions{order:2;display:grid;grid-template-columns:repeat(3,1fr);justify-self:stretch} .chead .search{grid-column:auto;order:3}
  .hactions .btn{padding:8px 6px;min-width:0}
  .hero,.cols,.two{grid-template-columns:1fr}
  .hero .side{display:none}
  .sticky{position:static}
  .chat{inset:0;width:100%;height:100%;border-radius:0;right:0;bottom:0}
  .pill-note{display:none}
  .rolebar .btn{margin-left:auto}
  .rolebar b{display:none} .rolebar .tabs{width:100%} .rolebar .tabs button{flex:auto;white-space:nowrap;padding:6px 8px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app"></div>
<div id="toast" hidden></div>

<script>
"use strict";
/* ---------- mock data ---------- */
const money = n => "₹" + Math.round(n).toLocaleString("en-IN");
const CATS = {fv:"Fruits & Veg", dairy:"Dairy & Bakery", staples:"Staples", snacks:"Snacks & Drinks", home:"Household"};
const P = [
 ["banana","Bananas","1 dozen",49,55,"fv","🍌","#F5C518"],["tomato","Tomatoes","500 g",32,40,"fv","🍅","#E5483B"],
 ["onion","Onions","1 kg",38,45,"fv","🧅","#C98BB9"],["spinach","Spinach","250 g",25,30,"fv","🥬","#3FA45B"],

/* sample QR: deterministic pattern, clearly not scannable */
function qrSvg(seed){
  const n=29, cells=[]; let s=seed*9301+49297;
  const rnd=()=>{s=(s*9301+49297)%233280;return s/233280};
  const finder=(x,y)=>x<8&&y<8||x>n-9&&y<8||x<8&&y>n-9;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    let on;
    if(finder(x,y)){const fx=x<8?x:x-(n-8),fy=y<8?y:y-(n-8);on=(fx===0||fx===6||fy===0||fy===6||(fx>=2&&fx<=4&&fy>=2&&fy<=4))&&fx<7&&fy<7}
    else on=rnd()>.52;
    if(on)cells.push(`<rect x="${x}" y="${y}" width="1.02" height="1.02"/>`);
  }
  return `<svg viewBox="-1 -1 ${n+2} ${n+2}" fill="#10261C" shape-rendering="crispEdges" role="img" aria-label="Sample UPI QR code, not scannable">${cells.join("")}</svg>`;
}

function advance(o){
  const i=FLOW.indexOf(o.status); if(i<0||i>=FLOW.length-1) return;
  const n=FLOW[i+1]; o.status=n;
  if(n==="Packed"){o.partner=o.partner||"Arjun K.";o.accepted=false}
  if(n==="Out for delivery")o.accepted=true;
  if(n==="Delivered"&&o.pay==="COD pending")o.pay="Paid";
}
function finishPayment(){
  const o=state.order; o.pay=state.co.method==="cod"?"COD pending":"Paid"; o.status="Placed"; o.when="Just now";
  state.cart={}; state.pay.phase="success"; state.view="done"; render();
}
function startPay(){
  const m=state.co.method, lines=cartItems();
  const label=METHODS[m][0];
  if(state.order&&state.order.status==="Pending payment"){state.order.method=label;state.order.total=total()}
  else{state.order={id:orderId(),mine:true,customer:"You",total:total(),items:count(),method:label,pay:"Pending",status:"Pending payment",partner:null,when:"Just now",lines};state.orders.unshift(state.order)}
  state.confirm=false;
  if(m==="cod"){finishPayment();return}
  state.pay={phase:"waiting",secs:600,seed:state.pay.seed+1,bank:null}; state.view="pay"; render();
}

}

  const o=state.order; if(!o||state.playing) return; state.playing=true;
  const step=()=>{ advance(o); o.accepted=true; if(o.status==="Delivered")state.playing=false; render(); if(state.playing)setTimeout(step,2200) };

}

function botReply(text){
  const t=text.toLowerCase(), budget=(t.match(/(?:under|below|within|₹|rs\.?)\s*(\d{3,5})/)||[])[1];
  const r=RECIPES.find(r=>r.keys.some(k=>t.includes(k)));
  if(r){
    let items=r.items.map(([id,qty])=>({id,qty,on:true})), note="";
    if(budget){const b=+budget;while(listTotal({items})>b&&items.length>2){let mi=0;items.forEach((it,i)=>{if(PM[it.id].price*it.qty>PM[items[mi].id].price*items[mi].qty)mi=i});items.splice(mi,1)}note=` I kept it under ${money(b)}.`}
    return {role:"bot",text:`Here's a list for "${r.title}".${note} Untick or change anything, then add it to your cart.`,list:{title:r.title,items,added:false}};
  }
  const words=t.split(/\W+/).filter(w=>w.length>2);
  const hits=P.filter(p=>words.some(w=>p.name.toLowerCase().includes(w)||CATS[p.cat].toLowerCase().includes(w))).slice(0,6);
  if(hits.length)return {role:"bot",text:"These look like a match. Adjust the quantities and add what you want.",list:{title:"Suggestions",items:hits.map(p=>({id:p.id,qty:1,on:true})),added:false}};

}

/* ---------- events ---------- */
function act(a,v,el){
  const S=state;
  switch(a){
    case "loginMode":S.loginMode=v;S.lgErr="";S.lg={email:"",pw:""};break;
    case "fill":{const a=ACCOUNTS.find(x=>x.email===v);S.lg={email:a.email,pw:a.pw};S.lgErr="";break}
    case "login":{
      const a=ACCOUNTS.find(x=>x.email===S.lg.email.trim().toLowerCase()&&x.pw===S.lg.pw), staff=S.loginMode==="staff";
      /* one generic message, and each sign-in page only accepts its own kind of account */
      if(!a||(staff&&a.role==="customer")||(!staff&&a.role!=="customer")){S.lgErr="Email or password is incorrect.";break}
      S.user=a;S.role=a.role;S.lgErr="";S.lg={email:"",pw:""};S.view="shop";S.atab="dashboard";S.drawer=false;S.assist=false;window.scrollTo(0,0);break}
    case "logout":S.user=null;S.drawer=false;S.assist=false;S.confirm=false;S.refund=null;S.loginMode=S.role==="customer"?"customer":"staff";S.lgErr="";window.scrollTo(0,0);break;
    case "cat":S.cat=v;S.q="";S.view="shop";break;
    case "inc":S.cart[v]=(S.cart[v]||0)+1;break;
    case "dec":S.cart[v]=Math.max(0,(S.cart[v]||0)-1);break;
    case "openCart":S.drawer=true;break; case "closeCart":S.drawer=false;break;
    case "toCheckout":S.drawer=false;S.view="checkout";window.scrollTo(0,0);break;
    case "goShop":S.view="shop";S.drawer=false;window.scrollTo(0,0);break;
    case "goOrders":S.view="orders";window.scrollTo(0,0);break;
    case "goTrack":S.view="track";window.scrollTo(0,0);break;
    case "trackOrder":S.order=S.orders.find(o=>o.id===v);S.view="track";window.scrollTo(0,0);break;
    case "setAddr":S.co.addr=v;break; case "setSlot":S.co.slot=v;break; case "setMethod":S.co.method=v;break; case "setApp":S.co.app=v;break;
    case "review":S.confirm=true;break; case "cancelConfirm":S.confirm=false;break; case "confirmPay":startPay();return;
    case "payDemo":payDemo(v);return;
    case "retry":S.pay={phase:"waiting",secs:600,seed:S.pay.seed+1,bank:S.pay.bank};if(S.order)S.order.pay="Pending";break;
    case "changeMethod":S.view="checkout";window.scrollTo(0,0);break;
    case "bank":S.pay.bank=v;break;
    case "play":playDelivery();return;
    case "openAssist":S.assist=true;S.drawer=false;break; case "closeAssist":S.assist=false;break;
    case "prompt":sendChat(v);return; case "sendChat":sendChat(S.chatInput);return;
    case "tick":{const[m,k]=v.split(":").map(Number),it=S.chat[m].list.items[k];it.on=!it.on;break}
    case "lq":{const[m,k,d]=v.split(":").map(Number),it=S.chat[m].list.items[k];it.qty=Math.max(1,it.qty+d);break}
    case "addList":{const l=S.chat[+v].list;l.items.filter(i=>i.on).forEach(i=>S.cart[i.id]=(S.cart[i.id]||0)+i.qty);l.added=true;S.chat.push({role:"bot",text:`Added to your cart. Review it when you're ready. I can't place orders or pay for you, so checkout is always your call.`});toast("Items added to your cart");break}
    case "atab":S.atab=v;break;
    case "adv":advance(S.orders.find(o=>o.id===v));break;
    case "assign":{const o=S.orders.find(o=>o.id===v);o.partner="Arjun K.";o.accepted=false;toast("Assigned to Arjun K.");break}
    case "refundOpen":{const o=S.orders.find(o=>o.id===v);S.refund={id:v,amt:o.total,why:"Customer request"};break}
    case "refundClose":S.refund=null;break;
    case "refundGo":{
      const o=S.orders.find(o=>o.id===S.refund.id),amt=Math.min(o.total,Math.max(1,parseInt(S.refund.amt,10)||0));
      o.pay="Refund pending";S.refund=null;toast("Refund requested. It completes when the gateway confirms.");
      setTimeout(()=>{o.pay=amt>=o.total?"Refunded":"Partially refunded";render()},2000);break}
    case "stock":{const[id,d]=v.split(":");S.stock[id]=Math.max(0,S.stock[id]+ +d);break}
    case "online":S.partner.online=!S.partner.online;break;
    case "paccept":{S.orders.find(o=>o.id===v).accepted=true;toast("Request accepted");break}
    case "pdecline":{const o=S.orders.find(o=>o.id===v);o.partner=null;o.accepted=false;toast("Declined. The store will reassign it.");break}
    case "ppick":advance(S.orders.find(o=>o.id===v));break;
    case "pdeliver":{const o=S.orders.find(o=>o.id===v);advance(o);toast("Delivered. Nice work!");break}
    case "codTick":S.partner.cod[v]=el.checked;break;
  }
  render();
}
document.addEventListener("click",e=>{
  const stop=e.target.closest("[data-stop]"), t=e.target.closest("[data-a]");
  if(!t)return;
  if(t.classList.contains("scrim")&&stop)return;
  if(t.dataset.a==="tick"||t.dataset.a==="codTick")return;
  act(t.dataset.a,t.dataset.v,t);
});
document.addEventListener("change",e=>{const t=e.target.closest("[data-a]");if(t&&(t.dataset.a==="tick"||t.dataset.a==="codTick"))act(t.dataset.a,t.dataset.v,t)});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){state.q=e.target.value;state.view="shop";if(state.role==="customer")render()}
  if(e.target.id==="chatIn")state.chatInput=e.target.value;
  if(e.target.id==="lgEmail")state.lg.email=e.target.value;
  if(e.target.id==="lgPw")state.lg.pw=e.target.value;
  if(e.target.id==="rAmt"&&state.refund)state.refund.amt=e.target.value;
  if(e.target.id==="rWhy"&&state.refund)state.refund.why=e.target.value;
});
document.addEventListener("keydown",e=>{
  if(e.target.id==="chatIn"&&e.key==="Enter"){e.preventDefault();sendChat(state.chatInput)}
  if((e.target.id==="lgPw"||e.target.id==="lgEmail")&&e.key==="Enter"){e.preventDefault();act("login",undefined,e.target)}
  if(e.key==="Escape"){state.drawer=false;state.confirm=false;state.assist=false;state.refund=null;render()}
  if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("app")){e.preventDefault();act("setApp",e.target.dataset.v,e.target)}
});
setInterval(()=>{
  if(state.role==="customer"&&state.view==="pay"&&state.pay.phase==="waiting"&&state.co.method==="qr"){
    state.pay.secs--; if(state.pay.secs<=0){state.pay.phase="expired";render()}
    else{const t=$("#qrTimer");if(t)t.textContent=String(Math.floor(state.pay.secs/60)).padStart(2,"0")+":"+String(state.pay.secs%60).padStart(2,"0")}
  }
},1000);

/* start from the hash so a link can open a specific view */
(function(){const h=location.hash.slice(1);
  if(h==="staff")state.loginMode="staff"; /* admin and partner views are only reachable by signing in */
  /* seed a realistic first view: two items already in the cart */
  state.cart={milk:2,eggs:1,banana:1};
})();
render();
</script>
